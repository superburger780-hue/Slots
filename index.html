<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROYAL GOLD 5x3 SLOTS</title>
<style>
  :root {
    --gold-light: #fff3b0;
    --gold: #ffd700;
    --gold-mid: #d4af37;
    --gold-dark: #8a6d1c;
    --green-on: #2ecc71;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    background: radial-gradient(circle at center, #2b1d0e 0%, #090603 100%);
    color: var(--gold-light);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }
  .gold-text {
    background: linear-gradient(180deg, #fff6c3 0%, #ffd700 45%, #b8860b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }
  .card {
    background: linear-gradient(145deg, #1f160d, #120c06);
    border: 2px solid var(--gold-mid);
    border-radius: 16px;
    box-shadow: 0 0 35px rgba(212, 175, 55, 0.25), inset 0 0 15px rgba(0,0,0,0.8);
    padding: 20px;
    width: 100%;
    max-width: 840px;
  }
  #setup-screen { max-width: 430px; text-align: center; }
  #secret-title { cursor: pointer; user-select: none; }
  input {
    width: 100%; padding: 11px 14px; margin-bottom: 10px;
    background: #0d0804; border: 1px solid var(--gold-dark);
    border-radius: 8px; color: var(--gold-light); font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--gold); box-shadow: 0 0 8px rgba(255, 215, 0, 0.35); }
  .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 8px 0 14px; }
  .avatar-opt {
    font-size: 26px; padding: 7px 0; background: #120b05;
    border: 2px solid #3d2e10; border-radius: 10px; cursor: pointer; user-select: none;
  }
  .avatar-opt.selected { border-color: var(--gold); background: rgba(255, 215, 0, 0.18); box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); }
  .btn {
    background: linear-gradient(180deg, #ffe566 0%, #d4af37 50%, #997316 100%);
    color: #1a1000; border: none; border-radius: 10px;
    padding: 12px 20px; font-size: 15px; font-weight: 800;
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: transparent; border: 1px solid var(--gold-mid);
    color: var(--gold); box-shadow: none; padding: 7px 12px; font-size: 13px;
  }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; padding-bottom: 14px; margin-bottom: 14px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.3);
  }
  .player-info { display: flex; align-items: center; gap: 10px; }
  .player-avatar {
    font-size: 30px; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: #0d0804; border: 2px solid var(--gold); border-radius: 50%;
  }
  .badge-admin {
    background: var(--gold); color: #000; font-size: 11px;
    font-weight: 900; padding: 2px 6px; border-radius: 4px; margin-left: 6px;
  }
  .balance-box {
    font-size: 19px; background: #0b0704;
    padding: 7px 14px; border-radius: 10px; border: 1px solid var(--gold-dark);
  }
  .slot-frame {
    background: linear-gradient(180deg, #3a290c, #171005);
    padding: 12px; border-radius: 14px; border: 3px solid var(--gold);
  }
  .reels-grid {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 8px; background: #080502; padding: 8px; border-radius: 10px;
  }
  .reel {
    display: flex; flex-direction: column; gap: 6px;
    background: linear-gradient(180deg, #140e07 0%, #24190c 50%, #140e07 100%);
    border: 1px solid #4d3b14; border-radius: 8px; padding: 5px; position: relative;
  }
  .cell {
    height: 80px; display: flex; align-items: center; justify-content: center;
    font-size: 40px; border-radius: 6px; user-select: none;
  }
  .reel.spinning .cell { animation: blurSpin 0.12s infinite linear; filter: blur(2px); }
  @keyframes blurSpin {
    0% { transform: translateY(-10px); opacity: 0.7; }
    50% { transform: translateY(10px); opacity: 1; }
    100% { transform: translateY(-10px); opacity: 0.7; }
  }
  .cell.win {
    background: rgba(255, 215, 0, 0.35);
    box-shadow: 0 0 18px var(--gold), inset 0 0 10px var(--gold);
    transform: scale(1.06);
  }
  .reel.locked { border: 2px solid #00f0ff; }
  .reel.locked::after {
    content: "LOCK"; position: absolute; top: -8px; left: 50%;
    transform: translateX(-50%); background: #00f0ff; color: #000;
    font-size: 9px; font-weight: 900; padding: 1px 5px; border-radius: 4px;
  }
  .status-banner { text-align: center; min-height: 30px; margin: 14px 0; font-size: 17px; font-weight: 700; color: var(--gold); }
  .controls {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; background: #100a05;
    padding: 12px 15px; border-radius: 12px; border: 1px solid #3d2e10;
  }
  .btn-respin { background: linear-gradient(180deg, #66f7ff 0%, #00a8cc 100%); color: #001820; }
  #admin-panel { margin-top: 20px; border-top: 2px dashed var(--gold-dark); padding-top: 15px; }
  .admin-header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; margin-bottom: 10px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #0d0804; }
  th, td { padding: 8px; text-align: left; border-bottom: 1px solid #2b200c; }
  th { color: var(--gold); }
  .dot { height: 9px; width: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  .online { background: var(--green-on); box-shadow: 0 0 6px var(--green-on); }
  .admin-input { width: 65px; padding: 4px; margin: 0; font-size: 13px; text-align: center; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8);
    display: flex; align-items: center; justify-content: center; padding: 15px; z-index: 100;
  }
  .modal-box { max-width: 400px; width: 100%; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <div id="setup-screen" class="card">
    <h1 id="secret-title" class="gold-text" style="margin-bottom:8px;">ROYAL GOLD 5×3</h1>
    <p style="font-size:13px; color:#bfa66a; margin-bottom:14px;">Выберите аватар и введите имя для входа в игру</p>

    <div class="avatar-grid" id="init-avatars"></div>
    <input type="text" id="init-name" placeholder="Ваше имя" maxlength="16">
    <input type="password" id="admin-pass-input" class="hidden" placeholder="Секретный пароль админа">

    <button class="btn" id="start-btn" style="width:100%" onclick="startGame()">Войти в игру</button>
    <div id="setup-error" style="color:#ff5555; font-size:13px; margin-top:10px;"></div>
  </div>

  <div id="game-screen" class="card hidden">
    <div class="top-bar">
      <div class="player-info">
        <div class="player-avatar" id="ui-avatar">👑</div>
        <div>
          <div>
            <strong id="ui-username" class="gold-text" style="font-size:17px;">Игрок</strong>
            <span id="ui-admin-badge" class="badge-admin hidden">ADMIN</span>
          </div>
          <div style="font-size:12px; color:#2ecc71;" id="conn-status">● Подключение...</div>
        </div>
      </div>

      <div class="balance-box">
        Баланс: <span id="ui-balance" class="gold-text">1000</span> 💰
      </div>

      <button class="btn btn-secondary" onclick="openProfileModal()">✏️ Профиль</button>
    </div>

    <div class="slot-frame"><div class="reels-grid" id="reels-container"></div></div>
    <div class="status-banner" id="status-text">Сделайте ставку и нажмите SPIN!</div>

    <div class="controls">
      <div style="display:flex; align-items:center; gap:8px;">
        <span>Ставка:</span>
        <button class="btn btn-secondary" onclick="changeBet(-10)">-</button>
        <strong id="ui-bet" style="min-width:45px; text-align:center; font-size:17px;">50</strong>
        <button class="btn btn-secondary" onclick="changeBet(10)">+</button>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="btn-respin" class="btn btn-respin hidden" onclick="spin(true)">
          RESPIN (<span id="respin-cost">30</span> 💰)
        </button>
        <button id="btn-spin" class="btn" onclick="spin(false)">SPIN</button>
      </div>
    </div>

    <div id="admin-panel" class="hidden">
      <div class="admin-header">
        <h3 class="gold-text">👑 Панель Администратора (Игроки в сети)</h3>
        <button class="btn btn-secondary" onclick="clearOldPlayers()">🗑 Очистить старых</button>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>Игрок</th><th>Статус</th><th>Баланс</th><th>Шанс (%)</th><th></th></tr>
          </thead>
          <tbody id="admin-users-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="profile-modal" class="modal-backdrop hidden">
    <div class="card modal-box">
      <h3 class="gold-text" style="margin-bottom:10px;">Настройка профиля</h3>
      <div class="avatar-grid" id="edit-avatars"></div>
      <input type="text" id="edit-name" placeholder="Новое имя" maxlength="16">
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button class="btn" style="flex:1" onclick="saveProfile()">Сохранить</button>
        <button class="btn btn-secondary" style="flex:1" onclick="closeProfileModal()">Отмена</button>
      </div>
    </div>
  </div>

<script>
  const DB_URL = 'https://' + 'sixseven-783d2-default-rtdb' + '.europe-west1.firebasedatabase.app';

  const AVATARS = Array.of('👑', '🦁', '🐺', '🐉', '💎', '🎩', '🦊', '🐯', '🦅', '🔥', '🃏', '💰');
  const ADMIN_PASS = '7777';

  const SYMBOLS = Array.of(
    { icon: '👑', mult: { 3: 10, 4: 30, 5: 100 } },
    { icon: '💎', mult: { 3: 6,  4: 18, 5: 50 } },
    { icon: '🔔', mult: { 3: 4,  4: 12, 5: 30 } },
    { icon: '🍀', mult: { 3: 3,  4: 8,  5: 20 } },
    { icon: '🍒', mult: { 3: 2,  4: 5,  5: 12 } },
    { icon: '🪙', mult: { 3: 1.5,4: 4,  5: 10 } }
  );

  const PAYLINES = Array.of(
    Array.of(1, 1, 1, 1, 1),
    Array.of(0, 0, 0, 0, 0),
    Array.of(2, 2, 2, 2, 2),
    Array.of(0, 1, 2, 1, 0),
    Array.of(2, 1, 0, 1, 2)
  );

  let isAdminMode = false;
  let playersMap = {};

  let profile = {
    id: 'p_' + Math.random().toString(36).substring(2, 9),
    name: 'Игрок',
    avatar: '👑',
    balance: 1000,
    isAdmin: false,
    winChance: 45,
    lastSeen: Date.now()
  };

  let selectedInitAvatar = '👑';
  let selectedEditAvatar = '👑';
  let currentBet = 50;
  let isSpinning = false;
  let gridState = new Array();
  let lockedReels = Array.of(false, false, false, false, false);
  let secretClicks = 0;

  document.getElementById('secret-title').addEventListener('click', () => {
    secretClicks++;
    if (secretClicks >= 5) {
      isAdminMode = true;
      document.getElementById('admin-pass-input').classList.remove('hidden');
      document.getElementById('admin-pass-input').focus();
    }
  });

  function renderAvatarPicker(containerId, currentAvatar, onSelect) {
    const box = document.getElementById(containerId);
    box.innerHTML = '';
    AVATARS.forEach(av => {
      const div = document.createElement('div');
      div.className = 'avatar-opt' + (av === currentAvatar ? ' selected' : '');
      div.textContent = av;
      div.onclick = () => {
        onSelect(av);
        renderAvatarPicker(containerId, av, onSelect);
      };
      box.appendChild(div);
    });
  }

  renderAvatarPicker('init-avatars', selectedInitAvatar, av => { selectedInitAvatar = av; });

  async function startGame() {
    const errEl = document.getElementById('setup-error');
    errEl.textContent = '';

    const rawName = document.getElementById('init-name').value.trim();
    profile.name = rawName || 'Игрок_' + Math.floor(100 + Math.random() * 900);
    profile.avatar = selectedInitAvatar;

    if (isAdminMode) {
      const pass = document.getElementById('admin-pass-input').value.trim();
      if (pass !== ADMIN_PASS) {
        errEl.textContent = 'Неверный пароль.';
        return;
      }
      profile.isAdmin = true;
      profile.winChance = 80;
    }

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');

    if (profile.isAdmin) {
      document.getElementById('ui-admin-badge').classList.remove('hidden');
      document.getElementById('admin-panel').classList.remove('hidden');
    }

    initBoard();
    updateUI();
    await syncWithCloud();
    setInterval(syncWithCloud, 2000);
  }

  async function syncWithCloud() {
    try {
      const res = await fetch(DB_URL + '/players.json');
      const all = (await res.json()) || {};

      if (all[profile.id] && !profile.isAdmin) {
        const remote = all[profile.id];
        if (remote.adminUpdatedAt && remote.adminUpdatedAt !== profile._lastAdminUpdate) {
          profile._lastAdminUpdate = remote.adminUpdatedAt;
          profile.balance = remote.balance;
          profile.winChance = remote.winChance;
          updateUI();
        }
      }

      profile.lastSeen = Date.now();
      await fetch(DB_URL + '/players/' + profile.id + '.json', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: profile.id,
          name: profile.name,
          avatar: profile.avatar,
          balance: profile.balance,
          winChance: profile.winChance,
          isAdmin: profile.isAdmin,
          lastSeen: profile.lastSeen
        })
      });

      all[profile.id] = Object.assign({}, profile);
      playersMap = all;

      document.getElementById('conn-status').textContent = '● В сети';
      document.getElementById('conn-status').style.color = '#2ecc71';

      if (profile.isAdmin) renderAdminTable();
    } catch (e) {
      document.getElementById('conn-status').textContent = '● Ошибка сети';
      document.getElementById('conn-status').style.color = '#ff5555';
    }
  }

  async function clearOldPlayers() {
    if (!profile.isAdmin) return;
    await fetch(DB_URL + '/players.json', { method: 'DELETE' });
    playersMap = {};
    await syncWithCloud();
  }

  function openProfileModal() {
    selectedEditAvatar = profile.avatar;
    document.getElementById('edit-name').value = profile.name;
    renderAvatarPicker('edit-avatars', selectedEditAvatar, av => { selectedEditAvatar = av; });
    document.getElementById('profile-modal').classList.remove('hidden');
  }

  function closeProfileModal() {
    document.getElementById('profile-modal').classList.add('hidden');
  }

  async function saveProfile() {
    const newName = document.getElementById('edit-name').value.trim();
    if (newName) profile.name = newName;
    profile.avatar = selectedEditAvatar;
    updateUI();
    closeProfileModal();
    await syncWithCloud();
  }

  function initBoard() {
    const container = document.getElementById('reels-container');
    container.innerHTML = '';
    gridState = new Array();
    for (let c = 0; c < 5; c++) {
      const reelEl = document.createElement('div');
      reelEl.className = 'reel';
      reelEl.id = 'reel-' + c;
      const colSyms = new Array();
      for (let r = 0; r < 3; r++) {
        const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        colSyms.push(sym);
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = 'cell-' + c + '-' + r;
        cell.textContent = sym.icon;
        reelEl.appendChild(cell);
      }
      gridState.push(colSyms);
      container.appendChild(reelEl);
    }
  }

  function changeBet(delta) {
    if (isSpinning) return;
    currentBet = Math.max(10, Math.min(500, currentBet + delta));
    document.getElementById('btn-respin').classList.add('hidden');
    clearLocks();
    updateUI();
  }

  function updateUI() {
    document.getElementById('ui-username').textContent = profile.name;
    document.getElementById('ui-avatar').textContent = profile.avatar;
    document.getElementById('ui-balance').textContent = Math.floor(profile.balance);
    document.getElementById('ui-bet').textContent = currentBet;
    document.getElementById('respin-cost').textContent = Math.ceil(currentBet * 0.6);
  }

  function clearLocks() {
    lockedReels = Array.of(false, false, false, false, false);
    for (let c = 0; c < 5; c++) document.getElementById('reel-' + c).classList.remove('locked');
  }

  function generateOutcome(isRespin) {
    const forceWin = Math.random() * 100 < profile.winChance;
    const newGrid = JSON.parse(JSON.stringify(gridState));

    for (let c = 0; c < 5; c++) {
      if (isRespin && lockedReels[c]) continue;
      for (let r = 0; r < 3; r++) newGrid[c][r] = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
    }

    if (forceWin) {
      const line = PAYLINES[Math.floor(Math.random() * PAYLINES.length)];
      const baseSym = (isRespin && lockedReels.at(0)) ? newGrid.at(0).at(line.at(0)) : SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      const count = Math.random() < 0.75 ? 3 : (Math.random() < 0.8 ? 4 : 5);
      for (let c = 0; c < count; c++) {
        if (!isRespin || !lockedReels[c]) newGrid[c][line[c]] = baseSym;
      }
    }
    return newGrid;
  }

  async function spin(isRespin = false) {
    if (isSpinning) return;
    const cost = isRespin ? Math.ceil(currentBet * 0.6) : currentBet;
    if (profile.balance < cost) {
      document.getElementById('status-text').textContent = 'Недостаточно средств!';
      return;
    }

    isSpinning = true;
    profile.balance -= cost;
    updateUI();

    document.getElementById('btn-spin').disabled = true;
    document.getElementById('btn-respin').classList.add('hidden');
    document.getElementById('status-text').textContent = isRespin ? '🔄 РЕСПИН...' : '🎰 ВРАЩЕНИЕ...';
    document.querySelectorAll('.cell.win').forEach(el => el.classList.remove('win'));
    if (!isRespin) clearLocks();

    const targetGrid = generateOutcome(isRespin);
    const intervals = new Array();

    for (let c = 0; c < 5; c++) {
      if (isRespin && lockedReels[c]) continue;
      document.getElementById('reel-' + c).classList.add('spinning');
      const iv = setInterval(() => {
        for (let r = 0; r < 3; r++) {
          document.getElementById('cell-' + c + '-' + r).textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)].icon;
        }
      }, 75);
      intervals.push({ col: c, iv: iv });
    }

    for (const item of intervals) {
      await new Promise(r => setTimeout(r, 300));
      clearInterval(item.iv);
      document.getElementById('reel-' + item.col).classList.remove('spinning');
      for (let r = 0; r < 3; r++) {
        gridState[item.col][r] = targetGrid[item.col][r];
        document.getElementById('cell-' + item.col + '-' + r).textContent = targetGrid[item.col][r].icon;
      }
    }

    evaluateWin(isRespin);
    isSpinning = false;
    document.getElementById('btn-spin').disabled = false;
    syncWithCloud();
  }

  function evaluateWin(wasRespin) {
    let totalWin = 0;
    const winCells = new Set();

    PAYLINES.forEach(line => {
      const first = gridState.at(0).at(line.at(0));
      let count = 1;
      for (let c = 1; c < 5; c++) {
        if (gridState[c][line[c]].icon === first.icon) count++;
        else break;
      }
      if (count >= 3) {
        totalWin += currentBet * first.mult[count];
        for (let c = 0; c < count; c++) winCells.add('cell-' + c + '-' + line[c]);
      }
    });

    if (totalWin > 0) {
      winCells.forEach(id => document.getElementById(id).classList.add('win'));
      profile.balance += totalWin;
      updateUI();
      document.getElementById('status-text').innerHTML = '✨ ВЫИГРЫШ: <span class="gold-text">+' + totalWin + ' 💰</span> ✨';
      clearLocks();
    } else {
      document.getElementById('status-text').textContent = 'Нет совпадений. Попробуйте еще!';
      if (!wasRespin) {
        for (let r = 0; r < 3; r++) {
          if (gridState.at(0)[r].icon === gridState.at(1)[r].icon) {
            lockedReels = Array.of(true, true, false, false, false);
            document.getElementById('reel-0').classList.add('locked');
            document.getElementById('reel-1').classList.add('locked');
            document.getElementById('btn-respin').classList.remove('hidden');
            document.getElementById('status-text').textContent = '🔥 Доступен РЕСПИН с удержанием 1 и 2 барабанов!';
            break;
          }
        }
      } else {
        clearLocks();
      }
    }
  }

  function renderAdminTable() {
    if (document.activeElement && document.activeElement.classList.contains('admin-input')) return;
    const tbody = document.getElementById('admin-users-table');
    tbody.innerHTML = '';

    Object.values(playersMap).forEach(p => {
      if (!p || !p.id) return;
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + p.avatar + ' <strong>' + p.name + '</strong> ' + (p.isAdmin ? '<span class="badge-admin">ADMIN</span>' : '') + '</td>' +
        '<td><span class="dot online"></span>В игре</td>' +
        '<td><input type="number" class="admin-input" id="b-' + p.id + '" value="' + Math.floor(p.balance) + '"></td>' +
        '<td><input type="number" class="admin-input" id="c-' + p.id + '" min="0" max="100" value="' + p.winChance + '"></td>' +
        '<td><button class="btn btn-secondary" onclick="applyAdminEdit(\'' + p.id + '\')">OK</button></td>';
      tbody.appendChild(tr);
    });
  }

  async function applyAdminEdit(targetId) {
    const newBal = parseFloat(document.getElementById('b-' + targetId).value) || 0;
    const newChance = Math.max(0, Math.min(100, parseInt(document.getElementById('c-' + targetId).value, 10) || 0));

    if (targetId === profile.id) {
      profile.balance = newBal;
      profile.winChance = newChance;
      updateUI();
    }

    await fetch(DB_URL + '/players/' + targetId + '.json', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        balance: newBal,
